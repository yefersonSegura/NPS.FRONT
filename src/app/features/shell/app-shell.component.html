<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 2C6.48 2 2 6.03 2 11c0 2.84 1.54 5.38 3.93 7.02.27.18.46.46.51.78l.38 2.58c.11.75.98 1.13 1.58.68l2.96-2.22c.24-.18.53-.26.83-.24 3.01.2 5.81-1.92 5.81-4.8 0-4.97-4.48-9-10-9zm0 16c-.23 0-.46-.02-.69-.05-1.11-.14-2.22.42-2.85 1.36l-1.57 1.18-.2-1.37c-.12-.8-.74-1.42-1.53-1.6C3.41 15.93 2 13.62 2 11c0-4.42 4.48-8 10-8s10 3.58 10 8-4.48 8-10 8z"
          />
          <path
            d="M12 6c-1.8 0-3.32 1.21-3.8 2.87h7.6C15.32 7.21 13.8 6 12 6zm-1.83 5.42l.66 2.03h2.34l-1.89 1.38.72 2.24-1.9-1.38-1.9 1.38.72-2.24-1.89-1.38h2.34l.66-2.03z"
          />
        </svg>
      </div>
      <span class="brand-text">Omega</span>
    </div>

    <nav class="sidebar-nav">
      @if (showDashboard()) {
        <a routerLink="/home/dashboard" routerLinkActive="active" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.21 15.89A10 10 0 1 1 8 2.83" />
            <path d="M22 12A10 10 0 0 0 12 2v10z" />
          </svg>
          Dashboard
        </a>
      }
      @if (showVote()) {
        <a routerLink="/home/vote" routerLinkActive="active" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
            <polyline points="10 9 9 9 8 9" />
          </svg>
          Vote
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="user-hint">{{ displayName() }}</div>
      <button type="button" class="nav-item btn-logout" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet />
  </main>
</div>

<div class="auth-wrapper">
  <div class="auth-container">
    <!-- Left Pane -->
    <div class="auth-left">
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.03 2 11c0 2.84 1.54 5.38 3.93 7.02.27.18.46.46.51.78l.38 2.58c.11.75.98 1.13 1.58.68l2.96-2.22c.24-.18.53-.26.83-.24 3.01.2 5.81-1.92 5.81-4.8 0-4.97-4.48-9-10-9zm0 16c-.23 0-.46-.02-.69-.05-1.11-.14-2.22.42-2.85 1.36l-1.57 1.18-.2-1.37c-.12-.8-.74-1.42-1.53-1.6C3.41 15.93 2 13.62 2 11c0-4.42 4.48-8 10-8s10 3.58 10 8-4.48 8-10 8z"/>
            <path d="M12 6c-1.8 0-3.32 1.21-3.8 2.87h7.6C15.32 7.21 13.8 6 12 6zm-1.83 5.42l.66 2.03h2.34l-1.89 1.38.72 2.24-1.9-1.38-1.9 1.38.72-2.24-1.89-1.38h2.34l.66-2.03z"/>
          </svg>
        </div>
        <span class="brand-text">Omega</span>
      </div>

      <div class="welcome-text">
        <h1>Bienvenido de nuevo</h1>
        <p>Inicia sesión para continuar y conocer el grado de lealtad de nuestros clientes.</p>
      </div>

      <div class="illustration">
        <!-- Gauge Chart Representation -->
        <div class="gauge-container">
          <svg viewBox="0 0 200 120" class="gauge-svg">
            <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="20" stroke-linecap="round"/>
            <path d="M 20 100 A 80 80 0 0 1 100 20" fill="none" stroke="#ef4444" stroke-width="20" stroke-linecap="round" stroke-dasharray="125" stroke-dashoffset="0"/>
            <path d="M 100 20 A 80 80 0 0 1 150 40" fill="none" stroke="#eab308" stroke-width="20" stroke-linecap="round"/>
            <path d="M 150 40 A 80 80 0 0 1 180 100" fill="none" stroke="#22c55e" stroke-width="20" stroke-linecap="round"/>
            <!-- Needle -->
            <circle cx="100" cy="100" r="8" fill="#fff" />
            <path d="M 100 100 L 70 50 L 105 95 Z" fill="#eab308" />
          </svg>
          <div class="floating-card c-1">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </div>
          <div class="floating-card c-2">
            <div class="chart-line"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Pane -->
    <div class="auth-right">
      <div class="login-card">
        <div class="login-header">
          <h2>Iniciar sesión</h2>
          <p>Ingresa tus credenciales para acceder</p>
        </div>

        @if (loading()) {
          <div class="loading-bar" aria-busy="true">Verificando credenciales…</div>
        }

        @if (error()) {
          <div class="error-alert" role="alert">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <span>{{ error() }}</span>
          </div>
        }

        <form class="login-form" (ngSubmit)="submit()">
          <div class="form-group">
            <label for="login-user">Usuario</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input
                id="login-user"
                name="username"
                type="text"
                placeholder="Usuario"
                [disabled]="loading()"
                [value]="username()"
                (input)="onUsernameInput($any($event.target).value)"
                autocomplete="username"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="login-pass">Contraseña</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input
                id="login-pass"
                name="password"
                #pwdInput
                type="password"
                placeholder="Contraseña"
                [disabled]="loading()"
                [value]="password()"
                (input)="onPasswordInput($any($event.target).value)"
                autocomplete="current-password"
              />
              <button type="button" class="toggle-pwd" (click)="pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password'" tabindex="-1">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-submit" [disabled]="loading()">
            {{ loading() ? 'Entrando…' : 'Ingresar' }}
          </button>
        </form>
      </div>
    </div>
  </div>
  <div class="footer-text">
    &copy; 2026 Omega NPS. Todos los derechos reservados.
  </div>
</div>
